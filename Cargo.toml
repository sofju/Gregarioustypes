[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["sofju"]
repository = "https://github.com/sofju/Gregarioustypes"

[workspace.dependencies]
gt-core = { path = "crates/gt-core" }
gt-ipc = { path = "crates/gt-ipc" }
gt-render = { path = "crates/gt-render" }
gt-ui = { path = "crates/gt-ui" }
gt-shell = { path = "crates/gt-shell" }
gt-fmt-misc = { path = "crates/gt-fmt-misc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
sha1 = "0.11"
sha2 = "0.11"
memmap2 = "0.9"

[workspace.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Win32_UI_Controls_RichEdit",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Imaging_D2D",
  "Win32_Graphics_Direct3D_Dxc",
  "Win32_Devices_Display",
  "Win32_Globalization",
  "Win32_System_Time",
  "Win32_System_WinRT",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_UI_Input_Pointer",
  "Win32_System_Search",
]

[workspace.dependencies.windows-numerics]
version = "0.3"

[workspace.dependencies.windows-core]
version = "0.62"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
